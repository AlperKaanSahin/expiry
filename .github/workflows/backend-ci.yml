name: Backend CI

on:
  pull_request:
    paths:
      - 'expiry_backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'expiry_backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: expiry_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: expiry_backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: expiry_test
      DB_DIALECT: mysql
      JWT_SECRET: ci-test-secret-not-real
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Migration'ları çalıştır
        run: npx sequelize-cli db:migrate

      - name: Seed'leri çalıştır
        run: npx sequelize-cli db:seed:all

      - name: Syntax/başlatma kontrolü
        run: node -e "require('./app.js')"

      - name: Testleri çalıştır
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-check

    defaults:
      run:
        working-directory: expiry_backend

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      - name: Docker image'ı build et (push edilmiyor, sadece build doğrulaması)
        run: docker build -t expiry_backend:ci-check .